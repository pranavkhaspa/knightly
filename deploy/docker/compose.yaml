services:
  falkordb:
    image: falkordb/falkordb:v4.22.1-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
      - "127.0.0.1:3000:3000"
    volumes:
      - falkordb-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "-p", "6379", "PING"]
      interval: 5s
      timeout: 3s
      retries: 20

  searxng:
    # Pinned so the JSON search contract and rate-limit behavior stay
    # reproducible for local demos. Update deliberately and re-run
    # internal/search tests. See deploy/docker/searxng/settings.yml for the
    # JSON-output configuration NightShift depends on.
    image: searxng/searxng:2026.10.11-ad46ebd7d
    restart: unless-stopped
    environment:
      SEARXNG_SETTINGS_PATH: /etc/searxng/settings.yml
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "127.0.0.1:8888:8080"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

  nightshift:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    depends_on:
      falkordb:
        condition: service_healthy
      searxng:
        condition: service_healthy
    environment:
      NIGHTSHIFT_LISTEN: "0.0.0.0:8080"
      NIGHTSHIFT_ENV: development
      NIGHTSHIFT_INSTANCE_ID: compose-edge
      NIGHTSHIFT_DATA_DIR: /var/lib/nightshift
      FALKORDB_URL: redis://falkordb:6379
      FALKORDB_CONTROL_GRAPH: nightshift_control
      FALKORDB_GRAPH: nightshift_u_demo
      FALKORDB_QUERY_TIMEOUT_MS: "5000"
      # Private SearXNG sidecar (JSON output enabled) for no-card web search.
      NIGHTSHIFT_SEARCH_URL: http://searxng:8080
      NIGHTSHIFT_ACTIONS_ENABLED: "false"
      NIGHTSHIFT_AUTH_TOKEN: ${NIGHTSHIFT_AUTH_TOKEN:-}
      NIGHTSHIFT_AUTH_USERNAME: ${NIGHTSHIFT_AUTH_USERNAME:-}
      NIGHTSHIFT_AUTH_PASSWORD: ${NIGHTSHIFT_AUTH_PASSWORD:-}
      NIGHTSHIFT_AUTH_TENANT_ID: ${NIGHTSHIFT_AUTH_TENANT_ID:-tenant_demo}
      NIGHTSHIFT_AUTH_USER_ID: ${NIGHTSHIFT_AUTH_USER_ID:-user_demo}
      NIGHTSHIFT_AUTH_APPROVER_ID: ${NIGHTSHIFT_AUTH_APPROVER_ID:-user_demo}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - nightshift-data:/var/lib/nightshift
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  falkordb-data:
  nightshift-data:
